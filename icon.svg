<!-- The home-screen icon: the white mark (logo.svg) on the brand green.
     The logo itself has no ground, but an icon needs one — an all-white icon on a transparent
     ground is invisible on a light wallpaper, in a white tab bar and in the app switcher. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" fill="#3f9a63"/>
  <g transform="translate(256 256) scale(0.86) translate(-256 -256)">
      <rect x="56" y="56" width="400" height="400" rx="80" stroke="#ffffff" stroke-width="34"/>
      <g fill="#ffffff">
        <g transform="rotate(-8 188 252)">
          <ellipse cx="188" cy="246" rx="56" ry="60"/>
          <ellipse cx="188" cy="316" rx="42" ry="50"/>
          <circle cx="245" cy="193" r="19"/>
          <circle cx="213" cy="169" r="16.5"/>
          <circle cx="175" cy="165" r="14.5"/>
          <circle cx="142" cy="181" r="12"/>
        </g>
        <g transform="rotate(8 324 252)">
          <ellipse cx="324" cy="246" rx="56" ry="60"/>
          <ellipse cx="324" cy="316" rx="42" ry="50"/>
          <circle cx="267" cy="193" r="19"/>
          <circle cx="299" cy="169" r="16.5"/>
          <circle cx="337" cy="165" r="14.5"/>
          <circle cx="370" cy="181" r="12"/>
        </g>
        <rect x="160" y="398" width="192" height="24" rx="12"/>
      </g>
  </g>
</svg>
